name: IndexNow
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attendre la publication GitHub Pages
        run: sleep 120
      - name: Prévenir IndexNow des pages modifiées
        run: python3 .github/scripts/indexnow.py "${{ github.event.before }}" "${{ github.sha }}"
