name: Contrôle hebdomadaire
on:
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi, 5 h UTC
  workflow_dispatch:
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fraîcheur des paramètres
        run: python3 .github/scripts/fraicheur.py
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Tests (calculs, liens, pages)
        run: python tests/run.py
      - name: Sources officielles encore accessibles (avertissement seulement)
        continue-on-error: true
        run: python3 .github/scripts/liens_sources.py
